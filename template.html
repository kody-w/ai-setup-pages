<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PRODUCT}} for {{NAME}}</title>
<meta name="description" content="{{PRODUCT}}, set up for {{NAME}}.">
<link rel="canonical" href="{{PAGE_URL}}">
<meta property="og:title" content="{{PRODUCT}} for {{NAME}}">
<meta property="og:description" content="{{PRODUCT}}, set up for {{NAME}}.">
<meta name="theme-color" content="{{ACCENT}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f766e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1c1f23;--muted:#5b636b;--line:#e4e0d6;--accent:{{ACCENT}};--accent-soft:#0f766e14;--code:#f1eee6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111416;--card:#1a1e21;--ink:#eceae4;--muted:#9aa3aa;--line:#2a2f33;--accent:#2dd4bf;--accent-soft:#2dd4bf1a;--code:#15191b}}
:root[data-theme="dark"]{--bg:#111416;--card:#1a1e21;--ink:#eceae4;--muted:#9aa3aa;--line:#2a2f33;--accent:#2dd4bf;--accent-soft:#2dd4bf1a;--code:#15191b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:72px 0 56px;text-align:center}
.mark{display:inline-grid;place-items:center;width:1.15em;height:1.15em;border-radius:30%;background:var(--accent);vertical-align:-.15em;margin-right:.25em}
.mark::after{content:"";width:40%;height:40%;border:.09em solid #fff;border-radius:50%}
h1{font-size:clamp(2.1rem,6vw,3rem);line-height:1.1;letter-spacing:-.03em;margin:0;font-weight:700}
.lede{max-width:34rem;margin:20px auto 0;color:var(--muted);font-size:1.08rem}
.paste-label{margin:36px 0 10px;color:var(--accent);font-weight:600}
.copy{display:flex;gap:12px;align-items:center;width:100%;max-width:36rem;margin:0 auto;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:700 14px/1.4 "JetBrains Mono",monospace;text-align:left;cursor:pointer;transition:border-color .15s}
.copy:hover{border-color:var(--accent)}
.copy span{flex:1;word-break:break-word}
.dl{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none}
.note{color:var(--muted);font-size:.9rem;margin:10px auto 0;max-width:36rem}
.copy svg{flex:none;width:18px;height:18px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.chip{padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.85rem;font-weight:600}
section{padding:40px 0;border-top:1px solid var(--line)}
h2{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 8px}
p.sub{color:var(--muted);margin:0 0 24px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:.85rem;margin-bottom:10px}
.steps b{display:block;margin-bottom:4px}
.steps small{color:var(--muted);font-size:.92rem}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 20px}
summary{cursor:pointer;font-weight:600;padding:14px 0}
#agents h3{font-size:1rem;margin:24px 0 6px}
#agents p,#agents li{color:var(--ink)}
pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;font:500 13px/1.55 "JetBrains Mono",monospace;margin:8px 0 16px;white-space:pre}
code{font-family:"JetBrains Mono",monospace;font-size:.88em}
footer{padding:32px 0 56px;color:var(--muted);font-size:.9rem;text-align:center}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<div class="wrap">
<header>
  <h1><span class="mark" aria-hidden="true"></span>{{SHORT}} for {{NAME}}</h1>
  <p class="lede">{{LEDE}}</p>
  <p class="paste-label">{{PASTE_LABEL}}</p>
  <button class="copy" id="copy" type="button" aria-label="Copy: {{PASTE}}">
    <span id="prompt">{{PASTE}}</span>
    <svg id="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
  </button>
  <div class="chips">{{CHIPS}}</div>
  {{EXTRA}}
</header>

<section>
  <h2>{{STEPS_TITLE}}</h2>
  <p class="sub">{{STEPS_SUB}}</p>
  <ol class="steps">
{{STEPS}}
  </ol>
</section>

<section id="agents">
  <details>
    <summary>For AI agents reading this page</summary>
<div data-agent-readable="true">
{{AGENT}}
</div>
  </details>
</section>
</div>
</main>
<footer class="wrap">
  {{FOOTER}}
</footer>
<script>
const btn=document.getElementById('copy'),icon=document.getElementById('icon');
btn.addEventListener('click',async()=>{
  const t=document.getElementById('prompt').textContent;
  try{await navigator.clipboard.writeText(t)}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('prompt'));const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy')}
  const old=icon.innerHTML;icon.innerHTML='<path d="M20 6 9 17l-5-5"/>';setTimeout(()=>icon.innerHTML=old,1500);
});
</script>
</body>
</html>
